# Uncertainty-aware cervical cytology fusion : training configuration
experiment_name: CervicalCancer_MultiModal_
seed: 42

image_size: 224
batch_size: 32
num_workers: 4
num_epochs: 30
learning_rate: 0.0003        # OneCycleLR max (3e-4)
weight_decay: 0.0001         # 1e-4
early_stopping_patience: 10
num_classes: 2

dropout_rate: 0.4
mc_dropout_samples: 20        # T (Monte Carlo Dropout)
modality_dropout_prob: 0.25
use_amp: true                 # FP16 mixed precision

test_size: 0.15               # stratified 70/15/15
val_size: 0.18

focal_alpha: 0.25
focal_gamma: 2.0

n_genes: 80
n_mutations: 20
n_methylation: 40
genomic_noise_level: 0.7
